name: Update app list and publish

# The site is rebuilt on a daily schedule. Star lists are not covered by the
# GitHub API or by webhooks at all, so there is no event to react to — the
# build reads the list pages itself and refreshes every repository.
on:
  schedule:
    # Once a day at 18:00 Asia/Tehran. Iran dropped DST in 2022 and sits at a
    # flat UTC+03:30 all year, so 18:00 local is 14:30 UTC — hence the :30.
    # GitHub's scheduler can lag several minutes under load; it is a
    # "no earlier than", not a guarantee.
    - cron: "30 14 * * *"
  push:
    paths-ignore:
      - "README.md"
      - "site/data/apps.json"
      - "data/list-cache.json"
      - "data/icon-cache.json"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Pages even when run from a side branch"
        type: boolean
        default: false
  # Lets anything that can hit the API push an update immediately:
  #   gh api repos/KiarashS/awesome-macOS-applications/dispatches \
  #     -f event_type=app-list-changed
  repository_dispatch:
    types: [app-list-changed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # configure-pages needs pages:write to switch Pages into "GitHub
      # Actions" mode. Without it the step cannot enable Pages and the
      # deploy job 404s, so the site silently stops updating.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only used to square off and shrink the downloaded app icons; the
      # build falls back to the original files if it is missing.
      - run: pip install --quiet Pillow

      - name: Read the star list and refresh every repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: KiarashS
          LIST_SLUG: app
          SITE_URL: https://kiarashs.github.io/awesome-macOS-applications/
        run: python3 scripts/build.py

      - name: Sanity-check the payload before it goes anywhere
        run: |
          python3 - <<'PY'
          import json, pathlib
          d = json.load(open("site/data/apps.json"))
          apps = d["apps"]
          assert len(apps) >= 10, f"only {len(apps)} apps — refusing to publish"
          assert d["categories"], "no categories"
          for a in apps:
              for key in ("full_name", "name", "url", "description", "category", "tags"):
                  assert a.get(key) not in (None, ""), f"{a.get('full_name')} is missing {key}"
              if a.get("icon"):
                  assert pathlib.Path("site", a["icon"]).exists(), f"{a['full_name']} icon missing on disk"
          have = sum(1 for a in apps if a.get("icon"))
          print(f"ok: {len(apps)} apps, {len(d['categories'])} categories, "
                f"{len(d['tags'])} tags, {have} real app icons")
          PY

      - name: Commit the refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # These files are generated, never hand-edited, so when two runs
          # race the freshly built copy simply wins. Rebasing them instead
          # only manufactures conflicts in apps.json and README.md and kills
          # the run, which is exactly what used to happen.
          for attempt in 1 2 3 4; do
            git add -A README.md site/data/apps.json site/icons \
                       data/list-cache.json data/icon-cache.json
            if git diff --cached --quiet; then
              echo "Nothing changed since the last run."
              exit 0
            fi
            git commit -m "chore: refresh app list ($(date -u +%Y-%m-%d))"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected; replaying our output on top of the remote tip."
            git fetch origin "${GITHUB_REF_NAME}"
            # Keep the working tree, move the base: our content, their history.
            git reset --soft "origin/${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push the refreshed data after four attempts."
          exit 1

      # enablement:true turns Pages on if it is off, and puts it in
      # workflow mode, so the site heals itself instead of needing someone
      # to flip a switch in Settings.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true

      - name: Say so if Pages could not be configured
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning::Could not configure GitHub Pages automatically."
          echo "::warning::Set Settings -> Pages -> Source to 'GitHub Actions'."

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to Pages
    needs: build
    if: github.ref_name == github.event.repository.default_branch || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
