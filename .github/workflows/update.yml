name: Update app list and publish

# GitHub publishes no event for "a repository was added to a star list" —
# star lists are not covered by the API or by webhooks at all. So the list is
# polled instead: a cheap check reads the list pages, compares the set of
# repositories against data/list-cache.json, and stops right there when
# nothing moved. Only a real change runs the full rebuild and redeploys.
on:
  schedule:
    # Membership poll. Adding a repo to the list shows up within ~15 minutes.
    - cron: "*/15 * * * *"
    # One full pass a day so star counts, descriptions and icons stay current
    # even during a stretch where the list itself never changes. Delete this
    # line if you would rather the site only ever move when the list moves.
    - cron: "30 23 * * *"
  push:
    paths-ignore:
      - "README.md"
      - "site/data/apps.json"
      - "data/list-cache.json"
      - "data/icon-cache.json"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Pages even when run from a side branch"
        type: boolean
        default: false
  # Lets anything that can hit the API push an update immediately:
  #   gh api repos/KiarashS/awesome-macOS-applications/dispatches \
  #     -f event_type=app-list-changed
  repository_dispatch:
    types: [app-list-changed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  poll:
    name: Has the list changed?
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.gate.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: KiarashS
          LIST_SLUG: app
        run: |
          # Everything except the 15-minute poll rebuilds unconditionally.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then
            echo "Triggered by ${{ github.event_name }} — running a full rebuild."
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state=$(python3 scripts/build.py --check-only)
          echo "Star list is $state."
          if [ "$state" = "changed" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Rebuild data
    needs: poll
    if: needs.poll.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # configure-pages needs pages:write to switch Pages into "GitHub
      # Actions" mode. Without it the step cannot enable Pages and the
      # deploy job 404s, so the site silently stops updating.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only used to square off and shrink the downloaded app icons; the
      # build falls back to the original files if it is missing.
      - run: pip install --quiet Pillow

      - name: Read the star list and refresh every repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: KiarashS
          LIST_SLUG: app
          SITE_URL: https://kiarashs.github.io/awesome-macOS-applications/
        run: python3 scripts/build.py

      - name: Sanity-check the payload before it goes anywhere
        run: |
          python3 - <<'PY'
          import json, pathlib
          d = json.load(open("site/data/apps.json"))
          apps = d["apps"]
          assert len(apps) >= 10, f"only {len(apps)} apps — refusing to publish"
          assert d["categories"], "no categories"
          for a in apps:
              for key in ("full_name", "name", "url", "description", "category", "tags"):
                  assert a.get(key) not in (None, ""), f"{a.get('full_name')} is missing {key}"
              if a.get("icon"):
                  assert pathlib.Path("site", a["icon"]).exists(), f"{a['full_name']} icon missing on disk"
          have = sum(1 for a in apps if a.get("icon"))
          print(f"ok: {len(apps)} apps, {len(d['categories'])} categories, "
                f"{len(d['tags'])} tags, {have} real app icons")
          PY

      - name: Commit the refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md site/data/apps.json site/icons data/list-cache.json data/icon-cache.json
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
            exit 0
          fi
          git commit -m "chore: refresh app list ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3 4; do
            git push -u origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

      # enablement:true turns Pages on if it is off, and puts it in
      # workflow mode, so the site heals itself instead of needing someone
      # to flip a switch in Settings.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true

      - name: Say so if Pages could not be configured
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning::Could not configure GitHub Pages automatically."
          echo "::warning::Set Settings -> Pages -> Source to 'GitHub Actions'."

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to Pages
    needs: build
    if: github.ref_name == github.event.repository.default_branch || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
