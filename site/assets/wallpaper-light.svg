<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sweeping translucent blue wave under a sky fading to warm cream">
  <!--
    A rendition of the macOS Tahoe "Light" desktop picture: the glassy
    sweeping wave, the bright rim light along its leading edge, and the sky
    falling from blue through pale to warm cream at the horizon. Drawn here
    rather than shipped from Apple's own file, which is not ours to
    redistribute.
  -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.05" y2="1">
      <stop offset="0%"   stop-color="#1f74c8"/>
      <stop offset="22%"  stop-color="#3f8dd8"/>
      <stop offset="44%"  stop-color="#7fb0dd"/>
      <stop offset="62%"  stop-color="#b9c9d8"/>
      <stop offset="78%"  stop-color="#e4dcc0"/>
      <stop offset="100%" stop-color="#f3e6bd"/>
    </linearGradient>

    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#57c2dd"/>
      <stop offset="60%"  stop-color="#2f8fd0"/>
      <stop offset="100%" stop-color="#1f6ec4"/>
    </linearGradient>

    <linearGradient id="mass" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#2a6fe8"/>
      <stop offset="32%"  stop-color="#0f47d6"/>
      <stop offset="62%"  stop-color="#1a53da"/>
      <stop offset="100%" stop-color="#3f7ae2"/>
    </linearGradient>

    <linearGradient id="crest" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#eae7cd"/>
      <stop offset="26%"  stop-color="#cfe0d2"/>
      <stop offset="52%"  stop-color="#7fc9dd"/>
      <stop offset="76%"  stop-color="#2f8ee2"/>
      <stop offset="100%" stop-color="#1450d8"/>
    </linearGradient>

    <linearGradient id="silver" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#dfe8ee"/>
      <stop offset="45%"  stop-color="#b9cbd8"/>
      <stop offset="100%" stop-color="#8ea6bb"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="28%"  stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%"  stop-color="#f2f8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dbeaff" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="whisper" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- Distant headland, far out of focus -->
  <g filter="url(#softer)" opacity="0.92">
    <path fill="url(#hill)" d="M-120 690 C 30 596, 130 548, 250 578 C 350 602, 404 664, 470 706 C 520 738, 560 754, 610 764 L610 1000 L-120 1000 Z"/>
    <path fill="#2f8fd0" opacity="0.55" d="M-140 742 C 60 690, 240 700, 420 742 C 520 766, 580 782, 660 790 L660 1000 L-140 1000 Z"/>
  </g>

  <!-- Far crest behind the main wave, with its banded ripples -->
  <g filter="url(#soft)">
    <path fill="url(#crest)" d="M560 700 C 860 520, 1140 356, 1660 236 L1660 1000 L560 1000 Z"/>
    <g stroke-linecap="round" fill="none" opacity="0.55">
      <path stroke="#f0ecd4" stroke-width="16" d="M690 640 C 960 486, 1220 356, 1660 258"/>
      <path stroke="#cfe4d8" stroke-width="13" d="M720 672 C 990 520, 1250 392, 1660 300"/>
      <path stroke="#79c6dd" stroke-width="15" d="M760 706 C 1020 560, 1280 436, 1660 348"/>
      <path stroke="#3f94e0" stroke-width="18" d="M800 744 C 1060 604, 1310 486, 1660 402"/>
    </g>
    <!-- the small serrated break where the crest folds over -->
    <path fill="#0f47d6" opacity="0.8" d="M1180 470 l38 -34 6 40 34 -40 8 42 34 -36 8 44 36 -34 10 44 34 -30 12 46 40 -30 v120 h-300 z"/>
  </g>

  <!-- The main mass, its leading edge sweeping from lower left to upper right -->
  <path filter="url(#soft)" fill="url(#mass)"
        d="M-60 918 C 200 828, 402 744, 686 596 C 940 462, 1226 300, 1680 206 L1680 1060 L-60 1060 Z"/>

  <!-- Soft interior folds -->
  <g filter="url(#soft)" opacity="0.5">
    <path fill="#4d84ea" d="M240 1000 C 420 860, 700 700, 1010 610 C 1240 544, 1450 520, 1680 512 L1680 1000 Z"/>
    <path fill="#0c3fce" d="M700 1000 C 840 852, 1080 730, 1330 676 C 1460 648, 1580 640, 1680 638 L1680 1000 Z"/>
  </g>

  <!-- The rim light: the signature of this picture -->
  <path filter="url(#whisper)" fill="none" stroke="url(#rim)" stroke-width="4.5" stroke-linecap="round"
        d="M-60 918 C 200 828, 402 744, 686 596 C 940 462, 1226 300, 1680 206"/>

  <!-- Pale silvery forms rolling across the foreground -->
  <g filter="url(#softer)" opacity="0.9">
    <path fill="url(#silver)" d="M-120 940 C 60 860, 210 878, 330 962 C 400 1012, 430 1040, 470 1060 L-120 1060 Z"/>
    <path fill="url(#silver)" d="M980 1060 C 1080 940, 1240 872, 1420 866 C 1530 862, 1610 878, 1680 902 L1680 1060 Z"/>
    <path fill="#c8d6e0" opacity="0.55" d="M300 1060 C 420 964, 600 918, 800 936 C 900 946, 960 972, 1010 1000 L1010 1060 Z"/>
  </g>
</svg>
