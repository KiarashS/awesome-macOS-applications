<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Sweeping translucent blue wave under a deep indigo night sky">
  <!--
    The night half of the same picture: macOS Tahoe "Dark". Near-black at the
    top falling through indigo to violet, the same sweeping wave in deep royal
    blue, and the rim light reduced to a thin bright thread. Drawn here rather
    than shipped from Apple's own file.
  -->
  <defs>
    <linearGradient id="sky" x1="0.15" y1="0" x2="0.05" y2="1">
      <stop offset="0%"   stop-color="#05070f"/>
      <stop offset="24%"  stop-color="#0d1236"/>
      <stop offset="46%"  stop-color="#231c66"/>
      <stop offset="66%"  stop-color="#3a2a86"/>
      <stop offset="84%"  stop-color="#4b3691"/>
      <stop offset="100%" stop-color="#53409a"/>
    </linearGradient>

    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3f4bb4"/>
      <stop offset="60%"  stop-color="#2733a0"/>
      <stop offset="100%" stop-color="#1a2286"/>
    </linearGradient>

    <linearGradient id="mass" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#2148d8"/>
      <stop offset="30%"  stop-color="#12308f"/>
      <stop offset="62%"  stop-color="#16357f"/>
      <stop offset="100%" stop-color="#2b4a86"/>
    </linearGradient>

    <linearGradient id="crest" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%"   stop-color="#2f63f0"/>
      <stop offset="30%"  stop-color="#1f47d0"/>
      <stop offset="62%"  stop-color="#16358f"/>
      <stop offset="100%" stop-color="#0d1f5e"/>
    </linearGradient>

    <linearGradient id="silver" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#8ea0c4"/>
      <stop offset="45%"  stop-color="#5f6f97"/>
      <stop offset="100%" stop-color="#3b4668"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9d8ff" stop-opacity="0.28"/>
      <stop offset="26%"  stop-color="#eef3ff" stop-opacity="0.86"/>
      <stop offset="52%"  stop-color="#fff6e0" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#9fc0ff" stop-opacity="0.42"/>
    </linearGradient>

    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="whisper" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <g filter="url(#softer)" opacity="0.85">
    <path fill="url(#hill)" d="M-120 690 C 30 596, 130 548, 250 578 C 350 602, 404 664, 470 706 C 520 738, 560 754, 610 764 L610 1000 L-120 1000 Z"/>
    <path fill="#2733a0" opacity="0.5" d="M-140 742 C 60 690, 240 700, 420 742 C 520 766, 580 782, 660 790 L660 1000 L-140 1000 Z"/>
  </g>

  <g filter="url(#soft)">
    <path fill="url(#crest)" d="M560 700 C 860 520, 1140 356, 1660 236 L1660 1000 L560 1000 Z"/>
    <g stroke-linecap="round" fill="none" opacity="0.5">
      <path stroke="#4d7cff" stroke-width="16" d="M690 640 C 960 486, 1220 356, 1660 258"/>
      <path stroke="#2f57e0" stroke-width="13" d="M720 672 C 990 520, 1250 392, 1660 300"/>
      <path stroke="#1e3ea8" stroke-width="15" d="M760 706 C 1020 560, 1280 436, 1660 348"/>
      <path stroke="#16307e" stroke-width="18" d="M800 744 C 1060 604, 1310 486, 1660 402"/>
    </g>
    <path fill="#0b1c52" opacity="0.85" d="M1180 470 l38 -34 6 40 34 -40 8 42 34 -36 8 44 36 -34 10 44 34 -30 12 46 40 -30 v120 h-300 z"/>
  </g>

  <path filter="url(#soft)" fill="url(#mass)"
        d="M-60 918 C 200 828, 402 744, 686 596 C 940 462, 1226 300, 1680 206 L1680 1060 L-60 1060 Z"/>

  <g filter="url(#soft)" opacity="0.45">
    <path fill="#2c56b8" d="M240 1000 C 420 860, 700 700, 1010 610 C 1240 544, 1450 520, 1680 512 L1680 1000 Z"/>
    <path fill="#0a1c62" d="M700 1000 C 840 852, 1080 730, 1330 676 C 1460 648, 1580 640, 1680 638 L1680 1000 Z"/>
  </g>

  <path filter="url(#whisper)" fill="none" stroke="url(#rim)" stroke-width="4" stroke-linecap="round"
        d="M-60 918 C 200 828, 402 744, 686 596 C 940 462, 1226 300, 1680 206"/>

  <g filter="url(#softer)" opacity="0.85">
    <path fill="url(#silver)" d="M-120 940 C 60 860, 210 878, 330 962 C 400 1012, 430 1040, 470 1060 L-120 1060 Z"/>
    <path fill="url(#silver)" d="M980 1060 C 1080 940, 1240 872, 1420 866 C 1530 862, 1610 878, 1680 902 L1680 1060 Z"/>
    <path fill="#4a5573" opacity="0.5" d="M300 1060 C 420 964, 600 918, 800 936 C 900 946, 960 972, 1010 1000 L1010 1060 Z"/>
  </g>
</svg>
